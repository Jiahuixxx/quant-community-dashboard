<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>情报雷达 · 量化社媒 + AI 助手/金融工具</title>
<style>
:root { --bar-h: 54px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f1115; color: #e6e6e6; display: flex; flex-direction: column; overflow: hidden;
}
.tabbar {
  height: var(--bar-h); flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 0 14px; background: #171a21; border-bottom: 1px solid #2a2f3a;
}
.brand { font-size: 14px; font-weight: 700; color: #9aa4b2; margin-right: 6px; white-space: nowrap; }
.tab {
  appearance: none; border: 1px solid transparent; background: transparent; color: #c2c8d0;
  font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all .15s; white-space: nowrap;
}
.tab:hover { background: #222732; }
.tab.active { background: #2b6cb0; color: #fff; }
.spacer { flex: 1; }
.hint { font-size: 12px; color: #6b7280; white-space: nowrap; }
.hint a { color: #6b7280; }
.frames { position: relative; flex: 1 1 auto; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
iframe.hidden { display: none; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 14px; }
@media (max-width: 560px) { .brand { display: none; } .tab { padding: 8px 10px; font-size: 13px; } }
</style>
</head>
<body>
<div class="tabbar">
  <span class="brand">📡 情报雷达</span>
  <button class="tab" data-target="quant">📊 量化社媒看板</button>
  <button class="tab" data-target="ai">🤖 AI 助手·金融工具看板</button>
  <span class="spacer"></span>
  <span class="hint" id="hint"></span>
</div>
<div class="frames">
  <div class="loading" id="loading">加载中 …</div>
  <iframe id="frame-quant" data-src="quant.html" title="量化社媒看板" class="hidden"></iframe>
  <iframe id="frame-ai" data-src="ai.html" title="AI 助手·金融工具看板" class="hidden"></iframe>
</div>
<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var loaded = {};
  var loadingEl = document.getElementById('loading');

  function activate(target) {
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.target === target); });
    ['quant', 'ai'].forEach(function (k) {
      var f = document.getElementById('frame-' + k);
      if (k === target) {
        if (!loaded[k]) {
          loadingEl.style.display = 'flex';
          f.addEventListener('load', function () { loadingEl.style.display = 'none'; }, { once: true });
          f.src = f.dataset.src;
          loaded[k] = true;
        } else {
          loadingEl.style.display = 'none';
        }
        f.classList.remove('hidden');
      } else {
        f.classList.add('hidden');
      }
    });
    try { localStorage.setItem('radar_tab', target); } catch (e) {}
    if (location.hash !== '#' + target) history.replaceState(null, '', '#' + target);
  }

  tabs.forEach(function (t) { t.addEventListener('click', function () { activate(t.dataset.target); }); });

  // 初始选中：URL hash（#quant/#ai，供飞书卡片深链） > localStorage > 默认量化
  var initial = (location.hash || '').replace('#', '');
  if (initial !== 'quant' && initial !== 'ai') {
    try { initial = localStorage.getItem('radar_tab') || ''; } catch (e) { initial = ''; }
  }
  if (initial !== 'quant' && initial !== 'ai') initial = 'quant';
  activate(initial);

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'quant' || h === 'ai') activate(h);
  });
})();
</script>
</body>
</html>
